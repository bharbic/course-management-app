services:
  db:
    image: postgres:17.6
    container_name: psqlcoursedb
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: CourseDB
    ports:
      - "5432:5432"
    volumes:
      - ./docker/postgres-data:/var/lib/postgresql/data
      - ./CourseDBPrefill.sql:/docker-entrypoint-initdb.d/CourseDB_backup.sql
    networks:
      - my-network

  api:
    build: ./CourseAPI
    container_name: springboot-api
    ports:
      - "8080:8080"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/CourseDB
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
    depends_on:
      - db
    volumes:
      - ./CourseAPI:/app
    networks:
      - my-network
    command: ["./gradlew", "bootRun"]

  frontend:
    build: ./CourseWebApp
    container_name: vite-frontend
    ports:
      - "5173:5173"
    volumes:
      - ./CourseWebApp:/app
      - /app/node_modules
    networks:
      - my-network
    command: [ "npm", "run", "dev", "--", "--host", "0.0.0.0" ]


networks:
  my-network:
    driver: bridge
